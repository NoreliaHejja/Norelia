[project]
name = "szte-agent"
version = "0.1.0"
description = "Személyes SZTE tanulmányi asszisztens (CooSpace, csak olvasás)"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
